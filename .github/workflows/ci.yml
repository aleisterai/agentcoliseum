name: CI

# Gate every push to main + every PR on the checks that the Vercel
# build does NOT run: typecheck, lint, and the vitest suite. The
# Vercel build already runs check:prerender-discipline + check:mcpb-sync
# + next build, so this workflow deliberately covers the complementary
# gap (a money-handling app shipping with no automated regression gate).
#
# The 650+ test suite is hermetic: it runs against an in-process pglite
# (WASM Postgres) via test/db-harness.ts and injects dummy env in
# test/setup.ts — no secrets, no Supabase, no Docker required.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a rapid push sequence
# doesn't queue stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The committed .npmrc pins store-dir to a dev-container path
      # (/sessions/...) that isn't writable on a GitHub runner — pnpm's
      # installer hits EACCES. Override the store location to a
      # workspace-local dir via pnpm's npm_config_* env support. We do
      # this here (not in .npmrc) so local dev keeps its own store.
      npm_config_store_dir: ${{ github.workspace }}/.pnpm-store
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # version comes from the `packageManager` field in package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # --retry=2 keeps the gate trustworthy despite one known
        # intermittent test (tracked as a follow-up): a real regression
        # still fails all attempts, a flaky one passes on retry.
        run: pnpm test -- --retry=2

      - name: Lint (non-blocking)
        # `pnpm lint` (bare eslint) has never been green repo-wide —
        # there's pre-existing debt in src/ (unescaped JSX entities,
        # prefer-const) and in sub-projects the root config also walks
        # (docs-site/.source generated files, packages/, scripts/).
        # Surface it here for visibility without blocking the gate.
        # Flip to a hard gate once the lint cleanup lands.
        run: pnpm lint
        continue-on-error: true
